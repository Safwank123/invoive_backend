services:
  - type: web
    name: invoice-backend
    env: python
    pythonVersion: 3.11
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn invoice_backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DEBUG
        value: '0'
      - key: ALLOWED_HOSTS
        value: '*'  # Use Render environment variables or override in the dashboard
